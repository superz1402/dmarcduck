name: Deploy to Cloudflare Workers

# Every push to main goes live: build (vite/vinext) -> wrangler deploy.
# Worker secrets (DATABASE_URL, CRON_SECRET) are stored on the Worker by
# bootstrap-neon.yml and persist across deploys; no secret handling here.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client (Postgres)
        run: npx prisma generate --schema prisma/schema.prisma

      - name: Build (vite + vinext -> Cloudflare Worker)
        run: npm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy

      - name: Smoke check (/api/health)
        run: |
          sleep 5
          for i in 1 2 3 4 5; do
            if curl -fsS https://dmarcduck.ansaribilal1402.workers.dev/api/health; then
              echo ""
              exit 0
            fi
            echo "attempt $i failed, retrying in 10s..."
            sleep 10
          done
          echo "health endpoint did not come up in time"
          exit 1

      - name: Summary
        run: |
          {
            echo "## Deployed to Cloudflare Workers"
            echo ""
            echo "- URL: https://dmarcduck.ansaribilal1402.workers.dev"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Health: https://dmarcduck.ansaribilal1402.workers.dev/api/health"
          } >> "$GITHUB_STEP_SUMMARY"
