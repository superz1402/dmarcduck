name: Bootstrap Neon database

# One-time (idempotent) production database bootstrap:
#   1. Create (or reuse) the Neon project named "dmarcduck"
#   2. Push the canonical Prisma schema to it (over the HTTPS SQL endpoint)
#   3. Store DATABASE_URL + CRON_SECRET as Worker secrets on the deployed
#      Cloudflare Worker (run deploy.yml first so the Worker exists)
#
# Safe to re-run:
#   - If the repo secret DATABASE_URL already exists, the workflow uses it and
#     only re-applies the schema (no project creation, no password rotation).
#   - First-ever run creates the project and rotates the role password to mint
#     a fresh connection string (the Neon API never returns stored passwords).
#
# NOTE: talks to console.neon.tech — the old api.neon.tech host no longer
# resolves (verified 2026-10-07, both from a local sandbox and GH runners).

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bootstrap-neon
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check whether DATABASE_URL secret already exists
        id: secrets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          names="$(curl -sS -H "Authorization: token $GH_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/secrets" \
            | python3 -c "import json,sys;print(' '.join(s['name'] for s in json.load(sys.stdin).get('secrets',[])))")"
          echo "repo secrets present: $names"
          if echo "$names" | grep -qw DATABASE_URL; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: First run — create (or reuse) Neon project + mint connection string
        id: neon
        if: steps.secrets.outputs.exists != 'true'
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          set -euo pipefail
          API="https://console.neon.tech/api/v2"
          existing="$(curl -sS -H "Authorization: Bearer $NEON_API_KEY" \
            "$API/projects" \
            | python3 -c "import json,sys;print(next((p['id'] for p in json.load(sys.stdin).get('projects',[]) if p['name'].lower()=='dmarcduck'),''))")"
          if [ -n "$existing" ]; then
            echo "reusing existing Neon project: $existing"
            project_id="$existing"
          else
            echo "creating Neon project dmarcduck..."
            project_id="$(curl -sS -X POST -H "Authorization: Bearer $NEON_API_KEY" \
              -H "Content-Type: application/json" \
              -d '{"project":{"name":"dmarcduck"}}' \
              "$API/projects" \
              | python3 -c "import json,sys;print(json.load(sys.stdin)['project']['id'])")"
          fi
          branch="$(curl -sS -H "Authorization: Bearer $NEON_API_KEY" \
            "$API/projects/$project_id/branches" \
            | python3 -c "import json,sys;bs=json.load(sys.stdin)['branches'];print(next(b['id'] for b in bs if b.get('primary') or b.get('default')))")"
          role="$(curl -sS -H "Authorization: Bearer $NEON_API_KEY" \
            "$API/projects/$project_id/branches/$branch/roles" \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['roles'][0]['name'])")"
          dbname="$(curl -sS -H "Authorization: Bearer $NEON_API_KEY" \
            "$API/projects/$project_id/branches/$branch/databases" \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['databases'][0]['name'])")"
          # The API never returns stored passwords; rotate once to mint a fresh
          # one (the response echoes the new password).
          password="$(curl -sS -X POST -H "Authorization: Bearer $NEON_API_KEY" \
            "$API/projects/$project_id/branches/$branch/roles/$role/reset_password" \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['role']['password'])")"
          # Derive the pooled host from the endpoint host:
          #   ep-xxx.c-N.region.aws.neon.tech -> ep-xxx-pooler.region.aws.neon.tech
          pooler="$(curl -sS -H "Authorization: Bearer $NEON_API_KEY" \
            "$API/projects/$project_id/endpoints" \
            | python3 scripts/neon_pooler_host.py "$branch")"
          uri="postgresql://$role:$password@$pooler/$dbname?sslmode=require"
          echo "::add-mask::$uri"
          echo "uri=$uri" >> "$GITHUB_OUTPUT"
          echo "project_id=$project_id" >> "$GITHUB_OUTPUT"

      - name: First run — set Worker secrets (DATABASE_URL, CRON_SECRET)
        if: steps.secrets.outputs.exists != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DATABASE_URL: ${{ steps.neon.outputs.uri }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "$DATABASE_URL" | npx wrangler secret put DATABASE_URL
          echo "$CRON_SECRET" | npx wrangler secret put CRON_SECRET

      - name: First run — mirror DATABASE_URL as a repo secret
        if: steps.secrets.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DATABASE_URL: ${{ steps.neon.outputs.uri }}
        run: |
          python3 scripts/set_github_secret.py "DATABASE_URL=$DATABASE_URL" \
            || echo "WARNING: GITHUB_TOKEN could not write repo secrets; Worker secret is set (step above)."

      - name: Push Prisma schema (HTTPS SQL endpoint, IPv4-first)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          npm ci
          npx prisma migrate diff --from-empty --to-schema-datamodel prisma/schema.prisma --script > /tmp/init.sql
          NODE_OPTIONS="--dns-result-order=ipv4first" node scripts/apply_neon_schema.mjs /tmp/init.sql

      - name: Summary
        run: |
          {
            echo "## Neon bootstrap complete"
            echo ""
            echo "- Schema verified against the production database"
            echo "- Health check: https://dmarcduck.ansaribilal1402.workers.dev/api/health"
            echo "- Next run of deploy.yml picks up any wrangler config changes"
          } >> "$GITHUB_STEP_SUMMARY"
